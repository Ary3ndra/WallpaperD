# Sample F-Droid metadata. On submission this goes to fdroiddata/metadata/org.piarsenal.wallpaperd.yml
# Replace the Repo URL and commit/tag with your real values. Bump versionCode for each release.
Categories:
  - Theming
License: MIT
AuthorName: PiArsenal
SourceCode: https://github.com/Ary3ndra/WallpaperD
IssueTracker: https://github.com/Ary3ndra/WallpaperD/issues

AutoName: WallpaperD

RepoType: git
Repo: https://github.com/Ary3ndra/WallpaperD.git

# Online sources depend on third-party network services; folder source is fully offline.
AntiFeatures:
  - NonFreeNet

Builds:
  - versionName: 1.0.0
    versionCode: 1
    commit: v1.0.0          # create this git tag on the release commit
    subdir: app
    gradle:
      - yes

# For reproducible builds (optional but recommended): publish a signed APK at a stable URL,
# extract its signature with `fdroid signatures`, and add:
# AllowedAPKSigningKeys: <sha256 of your signing cert>
# Then F-Droid verifies its build matches yours and publishes YOUR signature.

AutoUpdateMode: Version v%v
UpdateCheckMode: Tags
CurrentVersion: 1.0.0
CurrentVersionCode: 1
